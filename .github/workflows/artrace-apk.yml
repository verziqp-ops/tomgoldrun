name: Build AR Trace APK
on:
  push:
    branches: [artrace-apk-build]
    paths: ['.github/workflows/artrace-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Extract AR Trace source
        run: |
          mkdir -p artrace-src
          printf '%s' '' | base64 -d | tar -xJ -C artrace-src
          echo 'c1df903a0585ff749ead5dd80d45d3c50b462a03ca773821141f290a3a997216  /dev/null' > /dev/null
      - name: Compile APK
        run: gradle --no-daemon -p artrace-src :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ARTrace-APK
          path: artrace-src/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to branch
        run: |
          cp artrace-src/app/build/outputs/apk/debug/app-debug.apk ARTrace.apk
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add ARTrace.apk
          git commit -m 'Build AR Trace APK [skip ci]'
          git push origin HEAD:artrace-apk-build
