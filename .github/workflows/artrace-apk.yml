name: Build AR Trace APK
on:
  push:
    branches: [artrace-apk-build]
    paths: ['.github/workflows/artrace-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Restore persistent app signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: artrace-app-signing-key-v1
      - name: Ensure reusable debug signing key exists
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=AR Trace,O=Dryguny,C=UA"
          fi
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep SHA256
      - name: Extract AR Trace source
        run: |
          mkdir -p artrace-src
          printf '%s' '' | base64 -d | tar -xJ -C artrace-src
          echo 'c1df903a0585ff749ead5dd80d45d3c50b462a03ca773821141f290a3a997216  /dev/null' > /dev/null
      - name: Patch startup crash and bump version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("artrace-src/app/src/main/java/com/dryguny/artrace/MainActivity.java")
          s = p.read_text()
          old = "private final TrackingEngine tracker = new TrackingEngine();"
          assert old in s, "Tracking engine field not found"
          s = s.replace(old, "private TrackingEngine tracker;", 1)
          old = 'if (checkSelfPermission(Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED) startCamera();'
          assert old in s, "Camera start call not found"
          s = s.replace(old, "tracker = new TrackingEngine();" + chr(10) + "        " + old, 1)
          p.write_text(s)
          p = Path("artrace-src/app/build.gradle")
          t = p.read_text()
          assert "versionCode 1" in t
          t = t.replace("versionCode 1", "versionCode 2").replace("versionName '1.0.0'", "versionName '1.1.0'")
          old_cfg = chr(10).join(["    buildTypes {", "        release { minifyEnabled false }", "    }"])
          new_cfg = chr(10).join([
            "    signingConfigs {",
            "        reusableDebug {",
            "            storeFile file(System.getenv('HOME') + '/.android/debug.keystore')",
            "            storePassword 'android'",
            "            keyAlias 'androiddebugkey'",
            "            keyPassword 'android'",
            "        }",
            "    }",
            "    buildTypes {",
            "        debug { signingConfig signingConfigs.reusableDebug }",
            "        release { minifyEnabled false }",
            "    }"
          ])
          assert old_cfg in t, "Gradle buildTypes not found"
          t = t.replace(old_cfg, new_cfg, 1)
          p.write_text(t)
          PY
      - name: Apply AR Trace 1.2 performance and UI update
        run: |
          printf '%s' '' | base64 -d | tar -xJ -C artrace-src
          grep -q 'versionCode 3' artrace-src/app/build.gradle
          grep -q 'class TrackingEngine' artrace-src/app/src/main/java/com/dryguny/artrace/TrackingEngine.java
      - name: Compile APK
        run: gradle --no-daemon -p artrace-src :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ARTrace-APK
          path: artrace-src/app/build/outputs/apk/debug/app-debug.apk
      - name: Verify signed APK
        run: |
          test -s "$HOME/.android/debug.keystore"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep SHA256
          /usr/local/lib/android/sdk/build-tools/35.0.0/apksigner verify --print-certs artrace-src/app/build/outputs/apk/debug/app-debug.apk
          CERT_A=$(/usr/local/lib/android/sdk/build-tools/35.0.0/apksigner verify --print-certs artrace-src/app/build/outputs/apk/debug/app-debug.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          CERT_B=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | sed -n 's/.*SHA256: //p' | head -1 | tr -d ':' | tr '[:upper:]' '[:lower:]')
          echo "APK signer: $CERT_A"
          echo "Persisted key: $CERT_B"
          test "$CERT_A" = "$CERT_B"
      - name: Publish APK to branch
        run: |
          cp artrace-src/app/build/outputs/apk/debug/app-debug.apk ARTrace.apk
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add ARTrace.apk
          git commit -m 'Build AR Trace APK [skip ci]'
          git push origin HEAD:artrace-apk-build
