name: Build Expressive Keyboard APK

on:
  push:
    branches:
      - expressive-apk-build

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout builder files
        uses: actions/checkout@v4
        with:
          path: builder

      - name: Checkout Expressive Keyboard
        uses: actions/checkout@v4
        with:
          repository: kotlalipopus/Expressive-Keyboard
          ref: main
          path: src

      - name: Restore customization patch
        shell: bash
        run: |
          cat builder/expressive_builder/patch.part* | base64 -d > /tmp/expressive-patch.zip
          mkdir -p /tmp/expressive-patch
          unzip -q /tmp/expressive-patch.zip             'expressive_customization_bundle/apply_patch.py'             'expressive_customization_bundle/KEEP_UPDATE_KEY.txt'             'expressive_customization_bundle/app/expressive-update-key.jks'             'expressive_customization_bundle/app/src/main/res/xml/volume_accessibility_service.xml'             'expressive_customization_bundle/app/src/main/java/com/expressive/keyboard/VolumePanel.kt'             'expressive_customization_bundle/expressive-signing.properties'             -d /tmp/expressive-patch
          python3 /tmp/expressive-patch/expressive_customization_bundle/apply_patch.py "$GITHUB_WORKSPACE/src"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Android build
        shell: bash
        working-directory: src
        run: |
          chmod +x gradlew
          mkdir -p app/src/main/assets/fonts
          curl -fsSL --retry 3 -o app/src/main/assets/fonts/rounded.ttf             "https://raw.githubusercontent.com/google/fonts/main/ofl/nunito/Nunito%5Bwght%5D.ttf"             || rm -f app/src/main/assets/fonts/rounded.ttf

      - name: Build signed release APK
        shell: bash
        working-directory: src
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APK
        shell: bash
        run: |
          APK="$(find src/app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" ExpressiveKeyboard-custom.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ExpressiveKeyboard-custom-apk
          path: ExpressiveKeyboard-custom.apk
          if-no-files-found: error
          retention-days: 1
