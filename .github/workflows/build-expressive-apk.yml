name: Build Expressive Keyboard APK

on:
  push:
    branches:
      - expressive-apk-build

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout builder files
        uses: actions/checkout@v4
        with:
          path: builder

      - name: Checkout Expressive Keyboard
        uses: actions/checkout@v4
        with:
          repository: kotlalipopus/Expressive-Keyboard
          ref: main
          path: src

      - name: Restore customization patch
        shell: bash
        run: |
          cat builder/expressive_builder/patch.part* | base64 -d > /tmp/expressive-patch.zip
          mkdir -p /tmp/expressive-patch
          unzip -q /tmp/expressive-patch.zip             'expressive_customization_bundle/apply_patch.py'             'expressive_customization_bundle/app/src/main/res/xml/volume_accessibility_service.xml'             'expressive_customization_bundle/app/src/main/java/com/expressive/keyboard/VolumePanel.kt'             -d /tmp/expressive-patch
          python3 /tmp/expressive-patch/expressive_customization_bundle/apply_patch.py "$GITHUB_WORKSPACE/src"

          # Fix one extra closing brace in the v2 VolumePanel source.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/app/src/main/java/com/expressive/keyboard/VolumePanel.kt")
          s = p.read_text(encoding="utf-8")
          s = s.replace('    )\n}}\n\ninternal fun isVolumePanelAccessibilityEnabled',
                        '    )\n}\n\ninternal fun isVolumePanelAccessibilityEnabled', 1)
          p.write_text(s, encoding="utf-8")
          PY

          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/app/build.gradle.kts")
          s = p.read_text(encoding="utf-8")
          s = s.replace("versionCode = 15", "versionCode = (System.currentTimeMillis() / 1000L).toInt()")
          s = s.replace('versionName = "11.1.1"', 'versionName = "11.1.1-custom.2"')
          s = s.replace('            applicationIdSuffix = ".debug"\n', '')
          p.write_text(s, encoding="utf-8")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Android build
        shell: bash
        working-directory: src
        run: |
          chmod +x gradlew
          mkdir -p app/src/main/assets/fonts
          curl -fsSL --retry 3 -o app/src/main/assets/fonts/rounded.ttf             "https://raw.githubusercontent.com/google/fonts/main/ofl/nunito/Nunito%5Bwght%5D.ttf"             || rm -f app/src/main/assets/fonts/rounded.ttf

      - name: Build updateable APK
        shell: bash
        working-directory: src
        run: ./gradlew assembleDebug --stacktrace

      - name: Collect APK and signer
        shell: bash
        run: |
          APK="$(find src/app/build/outputs/apk/debug -name '*.apk' | head -n 1)"
          test -n "$APK"
          mkdir -p artifact
          cp "$APK" artifact/ExpressiveKeyboard-pixel-hitbox-v2-unsigned.apk
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -f "$BT/lib/apksigner.jar"
          cp "$BT/lib/apksigner.jar" artifact/apksigner.jar

      - name: Upload APK build
        uses: actions/upload-artifact@v4
        with:
          name: ExpressiveKeyboard-pixel-hitbox-v2-unsigned
          path: artifact/*
          if-no-files-found: error
          retention-days: 1
