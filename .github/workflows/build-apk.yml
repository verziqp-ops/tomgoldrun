name: Build experimental APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Check planner and matcher
        run: |
          mkdir -p /tmp/tom-tests
          javac -d /tmp/tom-tests app/src/main/java/ua/max/tomrun/Planner.java app/src/main/java/ua/max/tomrun/RgbMatcher.java app/src/main/java/ua/max/tomrun/VehicleModel.java tests/PlannerTests.java tests/MatcherTests.java
          java -cp /tmp/tom-tests PlannerTests
          java -cp /tmp/tom-tests MatcherTests
      - run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: TomRunPilot-experimental-APK
          path: app/build/outputs/apk/debug/app-debug.apk
